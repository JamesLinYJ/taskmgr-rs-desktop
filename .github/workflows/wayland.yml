# +-------------------------------------------------------------------------
#
#   taskmgr-rs - KDE Wayland 桌面集成流水线
#
#   文件:       .github/workflows/wayland.yml
#
#   日期:       2026年08月20日
#   环境:       GitHub-hosted Ubuntu x64；KWin Wayland；Flutter 3.44.7；Rust 1.97.1
#   作者:       JamesLinYJ
#   协助:       OpenAI Codex:gpt-5.6-sol
#   参考标准:   KDE plasma-window-management；Flutter Linux integration_test
# --------------------------------------------------------------------------

name: Wayland integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wayland.yml'
      - 'crates/taskmgr-linux/**'
      - 'flutter_app/integration_test/**'
      - 'flutter_app/lib/**'
      - 'flutter_app/linux/**'
      - 'packaging/linux/gnome-shell-extension/**'
      - 'scripts/audit-ci-pins.sh'
      - 'scripts/test-kwin-wayland.sh'
  pull_request:
    paths:
      - '.github/workflows/wayland.yml'
      - 'crates/taskmgr-linux/**'
      - 'flutter_app/integration_test/**'
      - 'flutter_app/lib/**'
      - 'flutter_app/linux/**'
      - 'packaging/linux/gnome-shell-extension/**'
      - 'scripts/audit-ci-pins.sh'
      - 'scripts/test-kwin-wayland.sh'
  schedule:
    - cron: '23 18 * * 3'

permissions:
  contents: read

jobs:
  kde-wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit immutable CI dependencies
        run: scripts/audit-ci-pins.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
      - name: Verify pinned Flutter SDK
        env:
          FLUTTER_GIT_REVISION: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
        run: |
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          if [[ "$actual_revision" != "$FLUTTER_GIT_REVISION" ]]; then
            echo "Flutter revision mismatch: expected $FLUTTER_GIT_REVISION, received $actual_revision" >&2
            exit 1
          fi
          git -C "$FLUTTER_ROOT" diff --quiet --no-ext-diff "$FLUTTER_GIT_REVISION" --
      - name: Install Linux and KWin test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev kwin-wayland plasma-workspace zenity dbus-x11
      - name: Resolve pinned Flutter packages
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Run real KWin Wayland integration test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: dbus-run-session -- scripts/test-kwin-wayland.sh
