# +-------------------------------------------------------------------------
#
#   taskmgr-rs - 四平台架构持续集成
#
#   文件:       .github/workflows/ci.yml
#
#   日期:       2026年08月20日
#   环境:       GitHub-hosted Windows/Linux x64/ARM64；Flutter 3.44.7；Rust 1.97.1
#   作者:       JamesLinYJ
#   协助:       OpenAI Codex:gpt-5.6-sol
#   参考标准:   GitHub Actions hosted runner matrix；Flutter desktop support matrix
# --------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  generated-code:
    name: Generated code and lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit immutable CI dependencies
        run: scripts/audit-ci-pins.sh
      - name: Test release asset assembly
        run: scripts/test-prepare-release-assets.sh
      - name: Validate GNOME window provider metadata and syntax
        run: |
          python3 -m json.tool \
            packaging/linux/gnome-shell-extension/window-provider@org.taskmgr_rs.TaskManager/metadata.json \
            >/dev/null
          node --check \
            packaging/linux/gnome-shell-extension/window-provider@org.taskmgr_rs.TaskManager/extension.js
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
      - name: Verify pinned Flutter SDK
        env:
          FLUTTER_GIT_REVISION: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
        run: |
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          if [[ "$actual_revision" != "$FLUTTER_GIT_REVISION" ]]; then
            echo "Flutter revision mismatch: expected $FLUTTER_GIT_REVISION, received $actual_revision" >&2
            exit 1
          fi
          git -C "$FLUTTER_ROOT" diff --quiet --no-ext-diff "$FLUTTER_GIT_REVISION" --
      - name: Install FRB generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: Resolve pinned Flutter packages
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Regenerate localization and bridge sources
        working-directory: flutter_app
        run: |
          flutter gen-l10n
          flutter_rust_bridge_codegen generate
      - name: Normalize generated formatting
        run: |
          cargo fmt --all
          dart format flutter_app/lib flutter_app/test flutter_app/integration_test
          find flutter_app/lib flutter_app/test flutter_app/integration_test \
            -type f -name '*.dart' -exec sed -i 's/[[:space:]]\+$//' {} +
      - name: Verify Cargokit lockfile mirror
        run: cmp Cargo.lock crates/taskmgr-bridge/Cargo.lock
      - name: Reject generated drift
        run: git diff --exit-code

  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - label: Windows x64
            runner: windows-2025
            platform: windows
            arch: x64
          - label: Windows ARM64
            runner: windows-11-arm
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: matrix.arch == 'x64'
        with:
          flutter-version: 3.44.7
          channel: stable
      - name: Verify pinned Flutter SDK
        if: matrix.arch == 'x64'
        shell: bash
        env:
          FLUTTER_GIT_REVISION: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
        run: |
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          if [[ "$actual_revision" != "$FLUTTER_GIT_REVISION" ]]; then
            echo "Flutter revision mismatch: expected $FLUTTER_GIT_REVISION, received $actual_revision" >&2
            exit 1
          fi
          git -C "$FLUTTER_ROOT" diff --quiet --no-ext-diff "$FLUTTER_GIT_REVISION" --
      - name: Bootstrap pinned Flutter on Linux ARM64
        if: matrix.arch == 'arm64' && runner.os == 'Linux'
        shell: bash
        env:
          FLUTTER_GIT_REVISION: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
          FLUTTER_GIT_TAG: 3.44.7
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "$FLUTTER_GIT_REVISION"
          actual_revision="$(git -C "$RUNNER_TEMP/flutter" rev-parse FETCH_HEAD)"
          if [[ "$actual_revision" != "$FLUTTER_GIT_REVISION" ]]; then
            echo "Flutter revision mismatch: expected $FLUTTER_GIT_REVISION, received $actual_revision" >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 --no-tags origin \
            "refs/tags/$FLUTTER_GIT_TAG:refs/tags/$FLUTTER_GIT_TAG"
          tagged_revision="$(git -C "$RUNNER_TEMP/flutter" rev-parse \
            "refs/tags/$FLUTTER_GIT_TAG^{commit}")"
          if [[ "$tagged_revision" != "$FLUTTER_GIT_REVISION" ]]; then
            echo "Flutter tag mismatch: $FLUTTER_GIT_TAG resolves to $tagged_revision" >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$actual_revision"
          git -C "$RUNNER_TEMP/flutter" diff --quiet --no-ext-diff "$FLUTTER_GIT_REVISION" --
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Bootstrap pinned Flutter on Windows ARM64
        if: matrix.arch == 'arm64' && runner.os == 'Windows'
        shell: pwsh
        env:
          FLUTTER_GIT_REVISION: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
          FLUTTER_GIT_TAG: 3.44.7
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git init $flutterRoot
          git -C $flutterRoot remote add origin https://github.com/flutter/flutter.git
          git -C $flutterRoot fetch --depth 1 origin $env:FLUTTER_GIT_REVISION
          $actualRevision = (git -C $flutterRoot rev-parse FETCH_HEAD).Trim()
          if ($actualRevision -ne $env:FLUTTER_GIT_REVISION) {
            throw "Flutter revision mismatch: expected $env:FLUTTER_GIT_REVISION, received $actualRevision"
          }
          $tagRef = "refs/tags/$($env:FLUTTER_GIT_TAG)"
          git -C $flutterRoot fetch --depth 1 --no-tags origin "$($tagRef):$($tagRef)"
          $taggedRevision = (git -C $flutterRoot rev-parse "$($tagRef)^{commit}").Trim()
          if ($taggedRevision -ne $env:FLUTTER_GIT_REVISION) {
            throw "Flutter tag mismatch: $env:FLUTTER_GIT_TAG resolves to $taggedRevision"
          }
          git -C $flutterRoot checkout --detach $actualRevision
          git -C $flutterRoot diff --quiet --no-ext-diff $env:FLUTTER_GIT_REVISION --
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $flutterRoot 'bin')
          & (Join-Path $flutterRoot 'bin\flutter.bat') --version
      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev dpkg-dev rpm
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Resolve pinned Flutter packages
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Flutter analysis
        working-directory: flutter_app
        run: flutter analyze
      - name: Flutter tests on Linux
        if: runner.os == 'Linux'
        working-directory: flutter_app
        run: flutter test
      - name: Flutter portable widget tests on Windows
        if: runner.os == 'Windows'
        working-directory: flutter_app
        run: >-
          flutter test
          test/widget_test.dart
          test/locale_scaling_test.dart
          test/process_columns_test.dart
          test/affinity_dialog_test.dart
          test/nice_dialog_test.dart
          test/message_dialog_test.dart
          test/run_task_dialog_test.dart
          test/window_options_test.dart
          test/application_icons_test.dart
          test/application_view_modes_test.dart
      - name: Build Linux release bundle
        if: runner.os == 'Linux'
        working-directory: flutter_app
        run: flutter build linux --release
      - name: Audit Linux release bundle
        if: runner.os == 'Linux'
        run: scripts/audit-linux-bundle.sh flutter_app/build/linux/${{ matrix.arch }}/release/bundle
      - name: Build Linux helper and packages
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p taskmgr-helper --locked
          scripts/build-linux-packages.sh \
            flutter_app/build/linux/${{ matrix.arch }}/release/bundle \
            target/release/taskmgr-helper \
            dist \
            0.3.0
          scripts/audit-linux-packages.sh dist 0.3.0 ${{ matrix.arch }}
      - name: Build Windows release bundle
        if: runner.os == 'Windows'
        working-directory: flutter_app
        run: flutter build windows --release
      - name: Audit Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/Audit-WindowsBundle.ps1 -Bundle flutter_app/build/windows/${{ matrix.arch }}/runner/Release
      - name: Build Windows helper and packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p taskmgr-helper --locked
          scripts/Build-WindowsPackages.ps1 `
            -Bundle flutter_app/build/windows/${{ matrix.arch }}/runner/Release `
            -Helper target/release/taskmgr-helper.exe `
            -Architecture ${{ matrix.arch }} `
            -Output dist `
            -Version 0.3.0
      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskmgr-rs-${{ matrix.platform }}-${{ matrix.arch }}
          path: flutter_app/build/linux/${{ matrix.arch }}/release/bundle
          if-no-files-found: error
      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskmgr-rs-${{ matrix.platform }}-${{ matrix.arch }}
          path: flutter_app/build/windows/${{ matrix.arch }}/runner/Release
          if-no-files-found: error
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskmgr-rs-${{ matrix.platform }}-${{ matrix.arch }}-packages
          path: dist/*
          if-no-files-found: error
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskmgr-rs-${{ matrix.platform }}-${{ matrix.arch }}-packages
          path: dist/*
          if-no-files-found: error
