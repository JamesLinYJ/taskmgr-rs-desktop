[workspace]
members = [
    "crates/taskmgr-core",
    "crates/taskmgr-linux",
    "crates/taskmgr-windows",
    "crates/taskmgr-bridge",
    "crates/taskmgr-helper",
]
default-members = [
    "crates/taskmgr-core",
    "crates/taskmgr-bridge",
    "crates/taskmgr-helper",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
authors = ["taskmgr-rs contributors"]
description = "A classic cross-platform Task Manager with a Flutter frontend and Rust backend."
license = "MIT"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
ash = "=0.38.0"
crossbeam-channel = "0.5.16"
flutter_rust_bridge = "=2.12.0"
libc = "0.2.175"
libloading = "=0.8.9"
png = "=0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.16"
zbus = "=5.14.0"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["allow-unsafe-code"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
debug = 0
debug-assertions = false
incremental = false
overflow-checks = false

[profile.diagnostics]
inherits = "release"
debug = "full"
strip = false
